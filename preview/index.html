<!DOCTYPE html>
<html lang="zh">
<head>

<title>灯箱预览 · 第 17 张</title>
<style>
  body { font-family: sans-serif; margin: 2em; background: #1b1b1b; color: #eee; }

  .ms { font-size: 1.2em; color: #8f8; }
  figure { margin: 1.5em 0; }
  figcaption { margin-bottom: .5em; color: #bbb; }
  img { background: #333; border: 1px solid #444; image-rendering: auto; }
  table { border-collapse: collapse; margin-top: 1em; }

<body>
<h1>灯箱预览 · 线性光 720×480</h1>
<p class="ms">本次线性出图耗时：354 毫秒</p>
<figure>

  <tr><td>目录图</td><td>720×480</td><td>否</td><td>74 毫秒</td></tr>
  <tr><td>目录图</td><td>360×240</td><td>否</td><td>46 毫秒</td></tr>
